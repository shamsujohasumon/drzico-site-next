# Builds the site on every push and puts the finished files (out/) on the "deploy" branch.
# Hostinger deploys the "deploy" branch, so the server only ever gets plain HTML/CSS/JS/images.
name: Build and deploy

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (images, pages, checks, .htaccess, sitemap)
        run: npm run build

      - name: Publish out/ to the deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
